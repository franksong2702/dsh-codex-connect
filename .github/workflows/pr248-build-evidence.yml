name: PR248 isolated build evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.number == 248 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Decode and verify the previously tested source delta
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from pathlib import Path
          packed=''.join(Path(f'.github/pr248-source.part{i}').read_text().strip() for i in range(4))
          data=gzip.decompress(base64.b64decode(packed,validate=True))
          assert hashlib.sha256(data).hexdigest()=='c37375d0474ba10f8cd9b77e961e4d84dcaf33f708ffabe8f8da78b4178c1c07'
          spec=json.loads(data)
          allowed={'MIGRATION.md','docs/experiments/adaptive-task-publication-gate.md','scripts/adaptive-task-browser-entry.tsx','scripts/adaptive-task-delegation-cases.json','scripts/adaptive-task-publication-session.mjs','scripts/adaptive-task-session-mock.mjs','scripts/check-adaptive-task-session.mjs','tests/adaptive-task-consent.spec.ts','tests/adaptive-task-http.spec.ts','tests/browser/adaptive-task-publication.browser.client.spec.tsx'}
          assert {f['path'] for f in spec['files']}==allowed
          for f in spec['files']:
            p=Path(f['path'])
            assert not p.is_symlink()
            assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==f['before'], f['path']
          subprocess.run(['git','apply','--check'],input=spec['patch'].encode(),check=True)
          subprocess.run(['git','apply'],input=spec['patch'].encode(),check=True)
          for f in spec['files']:
            assert hashlib.sha256(Path(f['path']).read_bytes()).hexdigest()==f['after'],f['path']
          for i in range(4): Path(f'.github/pr248-source.part{i}').unlink()
          Path('.github/workflows/pr248-build-evidence.yml').unlink()
          print('Source delta and all before/after hashes verified; temporary transport removed from candidate')
          PY
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm --config.minimum-release-age=0 install --frozen-lockfile
      - name: Build matching package files
        run: pnpm run build
      - name: Record candidate objects (not a branch update)
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          subprocess.run(['git','add','-A'],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          files=[]
          for name in paths:
            p=Path(name)
            if not p.exists(): files.append({'path':name,'deleted':True}); continue
            assert not p.is_symlink()
            data=p.read_bytes()
            files.append({'path':name,'content':base64.b64encode(data).decode(),'sha256':hashlib.sha256(data).hexdigest(),'mode':'100755' if name=='lib/bin.js' else '100644'})
          out=Path(os.environ['RUNNER_TEMP'])/'pr248-candidate';out.mkdir()
          (out/'candidate.json').write_text(json.dumps({'head':os.environ['SOURCE_HEAD'],'files':files}))
          subprocess.run(['git','-c','user.name=PR248 isolated validation','-c','user.email=validation@users.noreply.github.com','commit','-m','Isolated candidate for exact installed-package verification'],check=True)
          print('Candidate has',len(files),'file operations; no ref was pushed')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr248-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr248-candidate/candidate.json
          if-no-files-found: error
          retention-days: 2
      - name: Full candidate check
        run: pnpm run check
      - name: Install isolated Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser and signed-cookie recovery acceptance
        run: |
          pnpm run test:browser
          node scripts/check-adaptive-task-ui.mjs
          node scripts/check-adaptive-task-delegation-ui.mjs
      - name: Prepare pinned installed-session acceptance installer
        run: npm install --prefix "${{ runner.temp }}/phase2-npm" --ignore-scripts --no-audit --no-fund npm@10.9.3
      - name: Real installed old-package to closed-package synthetic upgrade
        env:
          MATRIX_NPM_CLI: ${{ runner.temp }}/phase2-npm/node_modules/npm/bin/npm-cli.js
        run: node scripts/check-adaptive-task-session.mjs --phase2
      - name: Retain diagnostic reports without credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr248-candidate-reports-${{ github.event.pull_request.head.sha }}
          path: output/playwright/**/report.json
          if-no-files-found: ignore
          retention-days: 2

  materialize-objects:
    needs: prepare
    if: always() && !cancelled() && github.event.pull_request.number == 248 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      # No checkout, dependencies, package scripts or executable artifact code in this write-scoped job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pr248-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Create inert Git blobs only; never update a ref or publish a release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import path from 'node:path'; import assert from 'node:assert/strict'; import {createHash} from 'node:crypto';
          const base=path.join(process.env.RUNNER_TEMP,'candidate');
          const input=JSON.parse(fs.readFileSync(path.join(base,'candidate.json'),'utf8'));
          assert.equal(input.head,process.env.SOURCE_HEAD); assert.match(input.head,/^[a-f0-9]{40}$/);
          assert.equal(process.env.REPO,'franksong2702/dsh-codex-connect'); assert.ok(input.files.length<40);
          const allowed=new Set(['MIGRATION.md','docs/experiments/adaptive-task-publication-gate.md','scripts/adaptive-task-browser-entry.tsx','scripts/adaptive-task-delegation-cases.json','scripts/adaptive-task-publication-session.mjs','scripts/adaptive-task-session-mock.mjs','scripts/check-adaptive-task-session.mjs','tests/adaptive-task-consent.spec.ts','tests/adaptive-task-http.spec.ts','tests/browser/adaptive-task-publication.browser.client.spec.tsx']);
          const trees=[]; const seen=new Set();
          for(const file of input.files){
            assert.ok(!seen.has(file.path));seen.add(file.path);
            const temporary=/^\.github\/(pr248-source\.part[0-3]|workflows\/pr248-build-evidence\.yml)$/.test(file.path);
            assert.ok(allowed.has(file.path)||/^lib\/[A-Za-z0-9_.-]+$/.test(file.path)||temporary,file.path);
            if(temporary) assert.equal(file.deleted,true);
            if(file.deleted){trees.push({path:file.path,mode:'100644',type:'blob',sha:null});continue;}
            const bytes=Buffer.from(file.content,'base64'); assert.ok(bytes.length<2000000);
            assert.equal(createHash('sha256').update(bytes).digest('hex'),file.sha256);
            assert.ok(['100644','100755'].includes(file.mode));
            const r=await fetch(`https://api.github.com/repos/${process.env.REPO}/git/blobs`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({content:file.content,encoding:'base64'})});
            assert.equal(r.status,201,`Git object creation failed for ${file.path}: ${r.status}`);
            const object=await r.json(); assert.match(object.sha,/^[a-f0-9]{40}$/);
            trees.push({path:file.path,mode:file.mode,type:'blob',sha:object.sha});
          }
          const result={parent:input.head,trees};fs.writeFileSync(path.join(base,'git-objects.json'),JSON.stringify(result,null,2));
          console.log(JSON.stringify(result));
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr248-git-objects-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/candidate/git-objects.json
          if-no-files-found: error
          retention-days: 2

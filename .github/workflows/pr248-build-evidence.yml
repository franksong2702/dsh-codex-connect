name: PR248 isolated build evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.number == 248 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm --config.minimum-release-age=0 install --frozen-lockfile
      - name: Build without publishing
        run: pnpm run build
      - name: Package public source and isolated development tools
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr248-offline"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source-sha.txt"
          git archive --format=tar.gz HEAD > "$out/source.tar.gz"
          tar -czf "$out/built-lib.tar.gz" lib
          tar -czf "$out/dependencies.tar.gz" node_modules
          gzip -c "$(command -v node)" > "$out/node.gz"
          npm pack pnpm@10.30.3 --ignore-scripts --pack-destination "$out" >/dev/null
          sha256sum "$out/"*.gz "$out/"*.tgz > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr248-offline-build-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr248-offline/
          if-no-files-found: error
          retention-days: 2

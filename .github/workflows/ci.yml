name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Default setup covers main/protected targets, not stacked feature PRs.
  # Keep that configuration intact; retain this supplemental report as an artifact.
  codeql-stacked:
    name: CodeQL stacked PR (${{ matrix.language }})
    if: github.event_name == 'pull_request' && github.base_ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Initialize source analysis
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze exact PR head without replacing default-setup uploads
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          output: codeql-results
          upload: never
          upload-database: false
      - name: Validate CodeQL evidence and reject findings
        run: node scripts/check-codeql-report.mjs codeql-results
      - name: Retain exact-head source-analysis report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-stacked-${{ matrix.language }}-${{ github.event.pull_request.head.sha }}
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 14

  validate:
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19.0', '24.x']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm --config.minimum-release-age=0 install --frozen-lockfile
      - name: Validate release workflow contract
        run: pnpm run check:release-workflow
      - name: Validate canary workflow contract
        run: pnpm run check:canary-workflow
      - name: Lint package and source hygiene
        run: pnpm run lint
      - name: Typecheck host and browser entries
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Verify built capability CLI and child exit
        run: pnpm run check:capability-cli
      - name: Validate package contents
        run: pnpm run pack:check
      - name: Validate declared DSH installation matrix
        run: pnpm --silent run check:dsh-matrix
      - name: Validate internal Split exact-host matrix
        run: node scripts/check-split-matrix.mjs
      - name: Verify committed build output
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- lib)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            exit 1
          fi

  browser-ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm --config.minimum-release-age=0 install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser UI regression tests
        run: pnpm run test:browser
      - name: Validate authenticated Split browser lifecycle
        run: node scripts/check-split-browser.mjs
      - name: Validate experimental Split Gateway conversation
        run: node scripts/check-split-conversation.mjs

  windows-canary-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Validate Windows canary subprocess contracts
        run: node scripts/check-dsh-next-contract.mjs

  # Alpha CI deliberately has no npm-publish job. Publishing requires a later,
  # separately authorized release workflow.

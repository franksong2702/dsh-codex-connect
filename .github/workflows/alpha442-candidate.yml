name: Alpha 4.42 isolated candidate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'franksong2702/release-alpha-4-42'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read public registry and prepare the distinct version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const r=await fetch('https://registry.npmjs.org/dsh-codex-connect',{signal:AbortSignal.timeout(15000)});
          assert.equal(r.status,200); const d=await r.json();
          console.log(JSON.stringify({tags:d['dist-tags'],candidateExists:!!d.versions['0.1.0-alpha.4.42']}));
          assert.equal(d.versions['0.1.0-alpha.4.42'],undefined,'Candidate must not already be published');
          JS
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json');d=json.loads(p.read_text());assert d['version']=='0.1.0-alpha.4.41'
          d['version']='0.1.0-alpha.4.42';p.write_text(json.dumps(d,indent=2)+'\n')
          p=Path('tests/__snapshots__/capability-cli.spec.ts.snap');s=p.read_text();assert s.count('0.1.0-alpha.4.41')==1
          p.write_text(s.replace('0.1.0-alpha.4.41','0.1.0-alpha.4.42'))
          assert 'ADAPTIVE_TASK_PUBLIC_RELEASE: boolean = false' in Path('src/adaptive-task-publication.ts').read_text()
          Path('.github/workflows/alpha442-candidate.yml').unlink()
          PY
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm --config.minimum-release-age=0 install --frozen-lockfile
      - name: Full check and identical-artifact declared-host installation
        run: |
          pnpm run check
          node scripts/check-dsh-matrix.mjs > "$RUNNER_TEMP/alpha442-matrix.json"
      - name: Record only verified pairs and recheck unchanged package identity
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'alpha442-matrix.json').read_text())
          v='0.1.0-alpha.4.42';hosts=json.loads(Path('compatibility.json').read_text())['dshPluginApi']['versions']
          assert m['pluginVersion']==v and m['sameArtifact'] is True
          assert [r['dshVersion'] for r in m['reports']]==hosts
          assert len({r['pluginArtifactSha256'] for r in m['reports']})==1
          p=Path('verified-compatibility.json');d=json.loads(p.read_text());assert all(e['version']!=v for e in d['pluginVersions'])
          d['pluginVersions'].append({'version':v,'verifiedDshVersions':hosts});d['checkedAt']='2026-09-23'
          p.write_text(json.dumps(d,indent=2)+'\n')
          p=Path('tests/update-compatibility.spec.ts');s=p.read_text()
          old="    { version: '0.1.0-alpha.4.41', verifiedDshVersions: ['0.1.2-rc.1', '0.1.5-alpha.1', '0.1.5-rc.1', '0.1.5-rc.2'] },"
          assert s.count(old)==1;p.write_text(s.replace(old,old+'\n'+old.replace('4.41','4.42')))
          PY
          pnpm exec vitest run tests/update-compatibility.spec.ts
          pnpm run lint:metadata
          node --input-type=module <<'JS'
          import {readFileSync,mkdirSync} from 'node:fs';import {join} from 'node:path';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const out=join(process.env.RUNNER_TEMP,'alpha442-pack');mkdirSync(out);
          const [p]=JSON.parse(execFileSync('npm',['pack','--ignore-scripts','--json','--pack-destination',out],{encoding:'utf8'}));
          assert.equal(p.name,'dsh-codex-connect');assert.equal(p.version,'0.1.0-alpha.4.42');
          const hash=createHash('sha256').update(readFileSync(join(out,p.filename))).digest('hex');
          const m=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'alpha442-matrix.json'),'utf8'));
          assert.equal(hash,m.reports[0].pluginArtifactSha256);console.log(JSON.stringify({version:p.version,packageSha256:hash,fileCount:p.files.length}));
          JS
      - name: Stage candidate files as inert data
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          subprocess.run(['git','add','-A'],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines();files=[]
          for name in paths:
            p=Path(name)
            if not p.exists():files.append({'path':name,'deleted':True});continue
            assert not p.is_symlink();b=p.read_bytes()
            files.append({'path':name,'content':base64.b64encode(b).decode(),'sha256':hashlib.sha256(b).hexdigest(),'mode':'100755' if name=='lib/bin.js' else '100644'})
          out=Path(os.environ['RUNNER_TEMP'])/'alpha442-candidate';out.mkdir()
          (out/'candidate.json').write_text(json.dumps({'head':os.environ['SOURCE_HEAD'],'files':files}))
          print('Candidate data prepared; no branch or release changed')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alpha442-candidate-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/alpha442-candidate/candidate.json
            ${{ runner.temp }}/alpha442-matrix.json
          if-no-files-found: error
          retention-days: 3
  objects:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: alpha442-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Create Git blobs only, without updating branches or releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const base=path.join(process.env.RUNNER_TEMP,'candidate');
          const input=JSON.parse(fs.readFileSync(path.join(base,'alpha442-candidate/candidate.json'),'utf8'));
          assert.equal(input.head,process.env.SOURCE_HEAD);assert.match(input.head,/^[a-f0-9]{40}$/);
          assert.equal(process.env.REPO,'franksong2702/dsh-codex-connect');assert.ok(input.files.length<20);
          const allowed=new Set(['package.json','verified-compatibility.json','tests/update-compatibility.spec.ts','tests/__snapshots__/capability-cli.spec.ts.snap']);
          const trees=[];const seen=new Set();
          for(const file of input.files){
            assert.ok(!seen.has(file.path));seen.add(file.path);
            const temporary=file.path==='.github/workflows/alpha442-candidate.yml';
            assert.ok(allowed.has(file.path)||/^lib\/[A-Za-z0-9_.-]+$/.test(file.path)||temporary,file.path);
            if(temporary)assert.equal(file.deleted,true);
            if(file.deleted){trees.push({path:file.path,mode:'100644',type:'blob',sha:null});continue;}
            const bytes=Buffer.from(file.content,'base64');assert.ok(bytes.length<2000000);assert.equal(createHash('sha256').update(bytes).digest('hex'),file.sha256);
            assert.ok(['100644','100755'].includes(file.mode));
            const r=await fetch(`https://api.github.com/repos/${process.env.REPO}/git/blobs`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({content:file.content,encoding:'base64'})});
            assert.equal(r.status,201);const object=await r.json();assert.match(object.sha,/^[a-f0-9]{40}$/);
            trees.push({path:file.path,mode:file.mode,type:'blob',sha:object.sha});
          }
          const result={parent:input.head,trees};fs.writeFileSync(path.join(base,'git-objects.json'),JSON.stringify(result,null,2));console.log(JSON.stringify(result));
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alpha442-git-objects-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/candidate/git-objects.json
          if-no-files-found: error
          retention-days: 3
  approved-dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'franksong2702/release-alpha-4-42'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      # Initially a no-op. An explicit job rerun may dispatch the already-approved release only after merge and exact-main CI.
      # No checkout, project code, package installation, OIDC, npm token or ref writes in this job.
      - name: Dispatch existing protected release workflow only after all existing gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const repo=process.env.REPO,version='0.1.0-alpha.4.42';assert.equal(repo,'franksong2702/dsh-codex-connect');assert.match(process.env.PR,/^[0-9]+$/);
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'};
          const get=async p=>{const r=await fetch(`https://api.github.com/repos/${repo}/${p}`,{headers,signal:AbortSignal.timeout(15000)});assert.equal(r.status,200);return r.json()};
          const pr=await get(`pulls/${process.env.PR}`);assert.equal(pr.head.ref,'franksong2702/release-alpha-4-42');assert.equal(pr.base.ref,'main');
          if(!pr.merged){console.log('NOT_READY: release candidate is not merged; no dispatch');process.exit(0);}
          const main=await get('branches/main');assert.equal(main.commit.sha,pr.merge_commit_sha,'Main changed; new maintainer review required');const sha=main.commit.sha;
          const pkg=await get(`contents/package.json?ref=${sha}`);assert.equal(JSON.parse(Buffer.from(pkg.content,'base64').toString()).version,version);
          const gate=await get(`contents/src/adaptive-task-publication.ts?ref=${sha}`);assert.ok(Buffer.from(gate.content,'base64').toString().includes('ADAPTIVE_TASK_PUBLIC_RELEASE: boolean = false'));
          const runs=await get(`actions/workflows/ci.yml/runs?head_sha=${sha}&branch=main&per_page=100`);const ci=runs.workflow_runs[0];
          assert.equal(ci.head_sha,sha);assert.equal(ci.head_branch,'main');assert.equal(ci.path,'.github/workflows/ci.yml');assert.equal(ci.event,'push');assert.equal(ci.status,'completed');assert.equal(ci.conclusion,'success');
          const jobs=await get(`actions/runs/${ci.id}/attempts/${ci.run_attempt}/jobs?per_page=100`);assert.equal(jobs.total_count,jobs.jobs.length);assert.ok(jobs.jobs.every(j=>j.status==='completed'&&j.conclusion==='success'));
          for(const name of ['validate (22.19.0)','validate (24.x)','browser-ui-regression','windows-canary-contract','phase2-host-regression (22.19.0)','phase2-host-regression (24.x)'])assert.ok(jobs.jobs.some(j=>j.name===name));
          const old=await get(`actions/workflows/release.yml/runs?head_sha=${sha}&event=workflow_dispatch&per_page=100`);
          if(old.workflow_runs.length){console.log(JSON.stringify({alreadyDispatched:old.workflow_runs.map(r=>({id:r.id,status:r.status,conclusion:r.conclusion}))}));process.exit(0);}
          const npm=await fetch(`https://registry.npmjs.org/dsh-codex-connect/${version}`,{signal:AbortSignal.timeout(15000)});assert.equal(npm.status,404,'Do not republish an existing version');
          const response=await fetch(`https://api.github.com/repos/${repo}/actions/workflows/release.yml/dispatches`,{method:'POST',headers,body:JSON.stringify({ref:'main',inputs:{version,confirm:'PUBLISH'}}),signal:AbortSignal.timeout(15000)});
          assert.equal(response.status,204);console.log(JSON.stringify({dispatched:true,sha,version,mainCi:ci.id,workflow:'release.yml',npmLatestPromotion:false}));
          JS

name: Publish alpha release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish (for example 0.1.0-alpha.4.8)
        required: true
        type: string
      confirm:
        description: Type PUBLISH to authorize this alpha release
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Pin npm for Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.6.4 --no-fund --no-audit
          test "$(npm --version)" = "11.6.4"
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "10.30.3"

      - name: Require successful CI for the exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-ci.mjs

      - name: Install dependencies from the lockfile
        run: pnpm --config.minimum-release-age=0 install --frozen-lockfile

      - name: Validate release input and target availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          readonly PACKAGE='dsh-codex-connect'

          if [[ "$CONFIRM" != 'PUBLISH' ]]; then
            echo 'The confirmation input must be exactly PUBLISH.' >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-alpha\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))*$ ]]; then
            echo "Version must be a strict alpha semver (got: $VERSION)." >&2
            exit 1
          fi

          package_name="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$package_name" != "$PACKAGE" || "$package_version" != "$VERSION" ]]; then
            echo "Input $VERSION does not match $PACKAGE@$package_version." >&2
            exit 1
          fi

          set +e
          npm_output="$(npm view "$PACKAGE@$VERSION" version --json 2>&1)"
          npm_status=$?
          set -e
          if (( npm_status == 0 )); then
            echo "npm version $PACKAGE@$VERSION already exists." >&2
            exit 1
          fi
          if [[ "$npm_output" != *E404* && "$npm_output" != *'404 Not Found'* && "$npm_output" != *'No match found'* ]]; then
            printf '%s\n' "$npm_output" >&2
            exit 1
          fi

          set +e
          git ls-remote --exit-code --refs origin "refs/tags/v${VERSION}" >/dev/null 2>&1
          tag_status=$?
          set -e
          if (( tag_status == 0 )); then
            echo "Git tag v$VERSION already exists." >&2
            exit 1
          fi
          if (( tag_status != 2 )); then
            echo "Could not verify whether Git tag v$VERSION exists (git status $tag_status)." >&2
            exit 1
          fi

          set +e
          release_output="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" 2>&1)"
          release_status=$?
          set -e
          if (( release_status == 0 )); then
            echo "GitHub release v$VERSION already exists." >&2
            exit 1
          fi
          if [[ "$release_output" != *'not found'* && "$release_output" != *'Not Found'* && "$release_output" != *404* ]]; then
            printf '%s\n' "$release_output" >&2
            exit 1
          fi

      - name: Run complete check before publishing
        run: pnpm run check

      - name: Pack the verified files without lifecycle scripts
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all -- lib)"
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          mv "$RUNNER_TEMP/release/"*.tgz "$RUNNER_TEMP/release/release.tgz"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/release/release.tgz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload the verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-package-${{ github.sha }}
          path: ${{ runner.temp }}/release/release.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - name: Check out release gate code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Pin npm for Trusted Publishing
        run: npm install --global npm@11.6.4 --no-fund --no-audit --ignore-scripts
      - name: Recheck exact SHA CI after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-ci.mjs
      - name: Download the verified package from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-package-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Verify package digest
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/release/release.tgz" | sha256sum --check --strict

      - name: Publish alpha through npm Trusted Publishing
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm publish "$RUNNER_TEMP/release/release.tgz" --tag alpha --provenance --ignore-scripts

      - name: Verify npm version and alpha dist-tag
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/verify-npm-readback.mjs

      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --generate-notes

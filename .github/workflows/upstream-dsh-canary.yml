name: Upstream DSH canary

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-dsh-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: resolve upstream channels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      latest: ${{ steps.dist-tags.outputs.latest }}
      next: ${{ steps.dist-tags.outputs.next }}
      alpha: ${{ steps.dist-tags.outputs.alpha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Resolve one immutable dist-tag snapshot
        id: dist-tags
        run: node scripts/check-dsh-next.mjs --dist-tags-output "$GITHUB_OUTPUT"
  canary:
    name: canary (${{ matrix.channel }})
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: latest
            dedupe_args: ""
          - channel: next
            dedupe_args: --dedupe-against latest
          - channel: alpha
            dedupe_args: --dedupe-against latest --dedupe-against next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm --config.minimum-release-age=0 install --frozen-lockfile
      - name: Check DSH upstream candidate
        id: first-canary
        continue-on-error: true
        run: pnpm --silent run check:dsh-next -- --channel "${{ matrix.channel }}" ${{ matrix.dedupe_args }} --resolved-latest "${{ needs.resolve.outputs.latest }}" --resolved-next "${{ needs.resolve.outputs.next }}" --resolved-alpha "${{ needs.resolve.outputs.alpha }}" --report .canary/first.json
      - name: Confirm a candidate failure
        id: second-canary
        if: steps.first-canary.outcome == 'failure'
        continue-on-error: true
        run: pnpm --silent run check:dsh-next -- --channel "${{ matrix.channel }}" ${{ matrix.dedupe_args }} --resolved-latest "${{ needs.resolve.outputs.latest }}" --resolved-next "${{ needs.resolve.outputs.next }}" --resolved-alpha "${{ needs.resolve.outputs.alpha }}" --report .canary/second.json
      - name: Record candidate tracking state
        if: always() && steps.first-canary.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FIRST_REPORT: .canary/first.json
          SECOND_REPORT: .canary/second.json
        with:
          script: |
            const fs = require('node:fs')
            const { pathToFileURL } = require('node:url')
            const trackerUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/canary-tracking.mjs`).href
            const { buildCanaryTrackingIssue } = await import(trackerUrl)
            if (!fs.existsSync(process.env.FIRST_REPORT)) {
              core.info('The candidate check produced no report; no version-scoped tracker can be updated.')
              return
            }
            const first = JSON.parse(fs.readFileSync(process.env.FIRST_REPORT, 'utf8'))
            const second = fs.existsSync(process.env.SECOND_REPORT)
              ? JSON.parse(fs.readFileSync(process.env.SECOND_REPORT, 'utf8'))
              : undefined
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const tracking = buildCanaryTrackingIssue(first, second, {
              runUrl,
              pluginCommit: context.sha,
            })
            if (tracking === undefined) {
              core.info('The channel is unchanged, older, or deduplicated; no candidate tracker is needed.')
              return
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            })
            const existing = issues.find(issue => issue.pull_request === undefined && issue.body?.includes(tracking.marker))
            if (existing === undefined) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: tracking.title,
                body: tracking.body,
                labels: [tracking.label],
              })
              core.notice(`Created DSH candidate tracker ${created.data.html_url}`)
              return
            }
            const labels = new Set(existing.labels.map(label => typeof label === 'string' ? label : label.name).filter(Boolean))
            labels.delete('bug')
            labels.delete('enhancement')
            labels.add(tracking.label)
            if (existing.state === 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'open',
                title: tracking.title,
                body: tracking.body,
                labels: [...labels],
              })
              core.notice(`Reopened DSH candidate tracker ${existing.html_url}`)
              return
            }
            if (existing.body?.includes(tracking.stateMarker) && existing.title === tracking.title) {
              core.info(`DSH candidate tracker ${existing.html_url} already records ${tracking.state}; no update is needed.`)
              return
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              title: tracking.title,
              body: tracking.body,
              labels: [...labels],
            })
            core.notice(`Updated DSH candidate tracker ${existing.html_url}`)
      - name: Fail after two unsuccessful checks
        if: steps.first-canary.outcome == 'failure' && steps.second-canary.outcome == 'failure'
        run: exit 1

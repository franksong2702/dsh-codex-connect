version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      deepseek-harness:
        applies-to: version-updates
        patterns:
          - "@deepseek-ai/*"
        update-types:
          - minor
          - patch
      pi-ai:
        applies-to: version-updates
        patterns:
          - "@earendil-works/*"
        update-types:
          - minor
          - patch
      npm-development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "@deepseek-ai/*"
          - "@earendil-works/*"
        update-types:
          - minor
          - patch
      npm-production:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - "@deepseek-ai/*"
          - "@earendil-works/*"
        update-types:
          - minor
          - patch
    ignore:
      # pi-ai must be upgraded together with the DSH plugin API contract.
      - dependency-name: "@earendil-works/pi-ai"
        versions:
          - ">=0.82.2"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
